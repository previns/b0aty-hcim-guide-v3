plugins {
	id 'java'
}

repositories {
	// Deliberately no mavenLocal(). A partial LWJGL in a developer's ~/.m2 --
	// every native classifier except one -- shadows Maven Central for the whole
	// module, and the runtime classpath then fails to resolve with an error
	// naming only .m2. Add it back only if you start publishing a local
	// RuneLite build.
	maven {
		url = 'https://repo.runelite.net'
		// Scope this repo to RuneLite's own groups, as the plugin template
		// does, so it is never consulted for anything else.
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
// Named as the plugin template names it: the hub's instructions tell authors to
// keep this in step with the renamed test class, and both tasks below use it.
def pluginMainClass = 'com.b0atyguide.B0atyGuidePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
}

group = 'com.b0atyguide'
version = '1.1.0'

// RuneLite targets Java 11 bytecode. --release rather than source/target so a
// newer local JDK cannot link against APIs the client will not have at runtime.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	useJUnit()
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat = 'full'
	}
}

/**
 * Run a development client with this plugin side-loaded.
 *
 *     ./gradlew run
 *
 * There is no RuneLite checkout involved: the client is an ordinary dependency
 * from repo.runelite.net, and ExternalPluginManager.loadBuiltin() registers this
 * plugin the way the plugin hub does.
 */
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Run a development RuneLite client with this plugin loaded'
	mainClass = pluginMainClass
	classpath = sourceSets.test.runtimeClasspath

	// loadBuiltin() refuses to run without assertions, deliberately: they catch
	// API misuse that would otherwise surface as odd behaviour in a live client.
	jvmArgs = ['-ea']

	// --developer-mode unlocks the widget and varbit inspectors, which is how
	// you find out what an unmatched NPC or object is actually called.
	//
	// Deliberately no --debug: it raises the ROOT logger to DEBUG and buries
	// this plugin's output under every other plugin's. src/test/resources/
	// logback.xml puts com.b0atyguide alone at DEBUG instead.
	args = ['--developer-mode']
}

/**
 * An all-in-one jar, as the plugin template builds. Not what the hub deploys --
 * it builds from source -- but it is how you hand someone a build to try.
 */
tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
